<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل قراءة الطفل</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>تسجيل قراءة الطفل</h1>
    <p id="message"></p>

    <section id="setupSection">
      <p>القصة المحددة: <strong id="selectedStory">جاري تحميل القصة...</strong></p>
      <p id="storageNotice" role="status"></p>

      <label class="check"><input type="checkbox" id="audioCheck" checked> تفعيل الصوت</label>
      <label class="check"><input type="checkbox" id="videoCheck"> تفعيل الكاميرا</label>

      <button id="startBtn" disabled>بدء التسجيل</button>
    </section>

    <section id="readingSection" class="hidden">
      <p>مدة التسجيل: <strong id="timer">00:00</strong></p>
      <video id="preview" autoplay muted playsinline class="hidden"></video>
      <h2 id="storyTitle"></h2>
      <p id="storyText"></p>
      <button id="stopBtn">إنهاء التسجيل ورفعه</button>
      <button id="cancelBtn" class="secondary">إلغاء</button>
    </section>

    <section id="resultSection" class="hidden">
      <h2>التسجيلات</h2>
      <div id="recordings"></div>
      <button id="retryBtn" class="secondary hidden" type="button">إعادة محاولة الحفظ</button>
      <button id="newBtn" type="button">تسجيل جديد</button>
    </section>
    <a id="readerBackLink" class="back-link" href="../3reading/stories.html">العودة إلى جلسة القراءة</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../database.js"></script>
  <script src="script.js"></script>
</body>
</html>
